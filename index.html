<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRITICAL SYSTEM OVERLOAD</title>
    <style>
        body {
            background-color: black;
            background-image: url('https://i.postimg.cc/25qwRdz5/20260502-221905.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.88);
            z-index: 1;
        }

        #main-wrapper {
            position: relative;
            z-index: 2;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #intro-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            font-size: 1.8em;
            color: #ff0000;
            font-weight: bold;
            animation: glitch 0.1s infinite;
        }

        @keyframes glitch {
            0% { transform: skew(1deg); } 50% { transform: skew(-1deg); } 100% { transform: skew(0deg); }
        }

        #terminal {
            display: none;
            flex-grow: 1;
            overflow-y: auto;
            font-size: 12px;
            padding-bottom: 60px;
        }

        .progress-container {
            margin: 5px 0 15px 0;
            border: 1px solid #0f0;
            width: 100%;
            height: 12px;
            background: #001100;
        }

        .progress-bar {
            height: 100%;
            background: #0f0;
            width: 0%;
        }

        .status-text { margin-top: 10px; color: #00ff00; font-weight: bold; }
        .danger { color: #ff0000; font-weight: bold; }
        .info { color: #ffffff; }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div id="main-wrapper">
        <div id="intro-screen">
            You Are Completely Fucked By <br>
            𝄞☠𝐒𝐇𝐀𝐇 𝐆☠︎︎𝄞
        </div>
        <div id="terminal"></div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const intro = document.getElementById('intro-screen');

        // Yahan har app ka process hai. 'speed' jitni zyada hogi, loading utni slow hogi.
        const tasks = [
            { name: "Initializing Kernel Exploit...", speed: 100 },
            { name: "Bypassing Android/iOS Security Patch...", speed: 150 },
            { name: "Extracting WhatsApp Database & Private Chats...", speed: 400 },
            { name: "Cloning Facebook Session Tokens...", speed: 350 },
            { name: "Mirroring TikTok Account Data...", speed: 300 },
            { name: "Accessing Instagram DMs & Deleted Media...", speed: 450 },
            { name: "Downloading Gmail Inbox & Attachments...", speed: 500 },
            { name: "Cracking Saved Chrome/Safari Passwords...", speed: 250 },
            { name: "Decrypting Hidden Gallery Folders...", speed: 600 },
            { name: "Fetching Real-time GPS Location...", speed: 200 },
            { name: "Uploading 4.8GB Data to Master Server...", speed: 800 },
            { name: "Injecting Permanent Rootkit...", speed: 150 }
        ];

        setTimeout(() => {
            intro.style.display = 'none';
            terminal.style.display = 'block';
            runSequence(0);
        }, 5000);

        async function runSequence(taskIndex) {
            if (taskIndex < tasks.length) {
                const task = tasks[taskIndex];
                
                const p = document.createElement('div');
                p.className = 'status-text';
                p.innerHTML = `> [TARGET_DEVICE] ${task.name}`;
                terminal.appendChild(p);

                const container = document.createElement('div');
                container.className = 'progress-container';
                const bar = document.createElement('div');
                bar.className = 'progress-bar';
                container.appendChild(bar);
                terminal.appendChild(container);

                await updateBar(bar, task.speed);

                const done = document.createElement('div');
                done.className = 'info';
                done.innerHTML = `> [STATUS] DATA_PACKET_${taskIndex + 101} RECEIVED SUCCESSFULLY.`;
                terminal.appendChild(done);
                
                terminal.scrollTop = terminal.scrollHeight;
                setTimeout(() => runSequence(taskIndex + 1), 1500);
            } else {
                // Final Scary Ending
                terminal.innerHTML = ""; // Screen clear kar do darr barhanay k liye
                const final = document.createElement('div');
                final.className = 'danger';
                final.style.fontSize = '18px';
                final.style.textAlign = 'center';
                final.style.marginTop = '20%';
                final.innerHTML = "CONNECTION LOST...<br><br>DEVICE STORAGE WIPED.<br>SYSTEM KERNEL PANIC.<br><br>ALL DATA PERMANENTLY STORED ON 𝄞☠𝐒𝐇𝐀𝐇 𝐆☠︎︎𝄞 SERVERS.<br><br>GOODBYE.";
                terminal.appendChild(final);
            }
        }

        function updateBar(bar, speed) {
            return new Promise(resolve => {
                let width = 0;
                const interval = setInterval(() => {
                    if (width >= 100) {
                        clearInterval(interval);
                        resolve();
                    } else {
                        width++;
                        bar.style.width = width + '%';
                    }
                }, speed);
            });
        }
    </script>
</body>
</html>
